# Deploy do servidor MCP no Cloud Run.
#
# Funciona nas duas formas de disparo:
#   - manual:  gcloud builds submit --config=cloudbuild.yaml --region=southamerica-east1 \
#                --service-account=projects/$PROJECT_ID/serviceAccounts/mcp-deployer@$PROJECT_ID.iam.gserviceaccount.com
#   - gatilho: push no main (Cloud Build -> Gatilhos, com a conta mcp-deployer)
#
# Nenhum segredo aparece aqui. Os valores sensíveis são montados pelo Cloud Run
# a partir do Secret Manager (--set-secrets), e o Cloud Build nunca os lê.

substitutions:
  _REGIAO: southamerica-east1
  _SERVICO: imagegen
  _REPO_AR: mcp
  _BUCKET: enviagora-mcp-imagegen
  _CONTA_SERVICO: mcp-imagegen@${PROJECT_ID}.iam.gserviceaccount.com
  _TETO_DIARIO_USD: "10"

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        # SHORT_SHA só é preenchido em build disparado por gatilho. Num
        # `gcloud builds submit` manual ele vem vazio, e a tag sairia inválida
        # ("imagegen:"), então caímos para BUILD_ID, que existe sempre.
        TAG="${SHORT_SHA}"
        [ -n "$$TAG" ] || TAG="${BUILD_ID}"
        IMAGEM="${_REGIAO}-docker.pkg.dev/${PROJECT_ID}/${_REPO_AR}/${_SERVICO}"
        # O passo de deploy precisa da mesma tag; /workspace sobrevive entre passos.
        echo "$$TAG" > /workspace/tag.txt
        echo "Construindo $$IMAGEM:$$TAG"
        docker build -t "$$IMAGEM:$$TAG" -t "$$IMAGEM:latest" .

  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        docker push --all-tags "${_REGIAO}-docker.pkg.dev/${PROJECT_ID}/${_REPO_AR}/${_SERVICO}"

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        TAG="$$(cat /workspace/tag.txt)"
        # O serviço é implantado pela tag imutável, não por :latest, para que dê
        # para voltar a uma revisão anterior sem ambiguidade.
        gcloud run deploy "${_SERVICO}" \
          --image="${_REGIAO}-docker.pkg.dev/${PROJECT_ID}/${_REPO_AR}/${_SERVICO}:$$TAG" \
          --region="${_REGIAO}" \
          --platform=managed \
          --service-account="${_CONTA_SERVICO}" \
          --min-instances=0 \
          --max-instances=1 \
          --concurrency=20 \
          --cpu=1 \
          --memory=1Gi \
          --timeout=300s \
          --no-invoker-iam-check \
          --set-env-vars="GCS_BUCKET=${_BUCKET},TETO_DIARIO_USD=${_TETO_DIARIO_USD},FUSO_HORARIO=America/Sao_Paulo,URL_ASSINADA_MINUTOS=60,OAUTH_HABILITADO=true,BASE_URL=https://${_SERVICO}-${PROJECT_NUMBER}.${_REGIAO}.run.app" \
          --set-secrets="REPLICATE_API_TOKEN=replicate-api-token:latest,OAUTH_CLIENT_ID=oauth-client-id:latest,OAUTH_CLIENT_SECRET=oauth-client-secret:latest,OAUTH_SENHA=oauth-senha:latest,OAUTH_ASSINATURA=oauth-assinatura:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 900s
